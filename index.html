      .turn-chart, .comparison-chart { width: 100%; height: 330px !important; max-height: 330px; }
      .comparison-table th, .comparison-table td { text-align: center; vertical-align: middle; font-size: .78rem; }
      .comparison-table thead th { background: #6d1b16 !important; color: #fff !important; border-color: #4d100d !important; }

      .comparison-table tbody tr:nth-child(even) td { background: #ead0cc !important; }
    </style>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-gauge@4.4.0/dist/chartjs-chart-gauge.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

    <script>
      try {
      const map = L.map("map", {
        tap: true,
        tapTolerance: 15,
        zoomControl: false,
        attributionControl: true,
        scrollWheelZoom: true,
        doubleClickZoom: true,
        boxZoom: true,
        touchZoom: true,
        touchZoomRotate: true,
        keyboard: true,
        bounceAtZoomLimits: false,
        minZoom: 11,
        maxZoom: 18,
        maxBoundsViscosity: 0.9
      }).setView([19.359, -99.213], 13);
      // also expose globally so external modules can access it if needed (e.g. Capa_pol.js)
      window.map = map;
      
      // Permitir gestos táctiles del mapa en celular sin bloquear el zoom de la página
      const mapContainer = map.getContainer();
      mapContainer.style.touchAction = 'none';
      mapContainer.style.userSelect = 'none';
      mapContainer.style.webkitUserSelect = 'none';
      mapContainer.style.webkitTouchCallout = 'none';
      
      const satelitalLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          attribution: "Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye",
          maxZoom: 20
        }
      );

      const etiquetasLayer = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution: "&copy; OpenStreetMap contributors",
          maxZoom: 19
        }
      );

      const streetLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        {
          attribution: "Tiles &copy; Esri &mdash; Source: Esri",
          maxZoom: 20
        }
      );

      const topoLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
        {
          attribution: "Tiles &copy; Esri &mdash; Source: Esri",
          maxZoom: 20
        }
      );

      const natGeoLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}",
        {
          attribution: "Tiles &copy; Esri &mdash; Source: Esri",
          maxZoom: 20
        }
      );

      const darkLayer = L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
          attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
          subdomains: "abcd",
          maxZoom: 20
        }
      );

      const lightLayer = L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        {
          attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
          subdomains: "abcd",
          maxZoom: 20
        }
      );

      const baseLayers = {
        satelite: satelitalLayer,
        labels: etiquetasLayer
      };

      let activeBaseKey = "labels";

      function setBaseLayer(key) {
        if (!baseLayers[key]) return;

        Object.entries(baseLayers).forEach(([name, layer]) => {
          if (map.hasLayer(layer)) map.removeLayer(layer);
        });

        map.addLayer(baseLayers[key]);
        activeBaseKey = key;

        const selector = document.querySelector('[data-base-selector="true"]');
        if (selector) {
          selector.querySelectorAll('button').forEach((btn) => {
            const isActive = btn.dataset.layer === key;
            btn.style.background = isActive ? '#922B21' : '#fff';
            btn.style.color = isActive ? '#fff' : '#444';
            btn.style.borderColor = isActive ? '#922B21' : '#ddd';
          });
        }
      }

      const baseSelectorControl = L.control({ position: "bottomright" });
      baseSelectorControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'leaflet-control-base-selector');
        div.setAttribute('data-base-selector', 'true');
        div.innerHTML = `
          <div style="background:white;border:1px solid #ddd;border-radius:10px;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:6px;min-width:150px;">
            <div style="font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.06em;">Vista base</div>
            <button type="button" data-layer="satelite" style="border:1px solid #ddd;border-radius:6px;padding:6px 8px;background:#fff;color:#444;text-align:left;font-size:12px;cursor:pointer;">🛰️ Satelital</button>
            <button type="button" data-layer="labels" style="border:1px solid #ddd;border-radius:6px;padding:6px 8px;background:#fff;color:#444;text-align:left;font-size:12px;cursor:pointer;">🗺️ Etiquetas</button>
          </div>`;

        div.querySelectorAll('button').forEach((btn) => {
          btn.addEventListener('click', () => setBaseLayer(btn.dataset.layer));
        });

        return div;
      };

      baseSelectorControl.addTo(map);
      setBaseLayer(activeBaseKey);

      // ====== LÍMITE AO ======
      const SIDEBAR_WIDTH = 300;
      const SIDEBAR_OPEN_LEFT_PADDING = SIDEBAR_WIDTH + 20;
      const SIDEBAR_CLOSED_LEFT_PADDING = 20;
      let limiteLayer = null;
      let limiteBounds = null;

      window.adjustMapForSidebar = function() {
        if (!limiteBounds || !window.map) return;
        const isSidebarOpen = !document.getElementById('sidebarContainer').classList.contains('oculto');
        const paddingTopLeft = isSidebarOpen ? [SIDEBAR_OPEN_LEFT_PADDING, 20] : [SIDEBAR_CLOSED_LEFT_PADDING, 20];
        const paddingBottomRight = [20, 20];
        window.map.invalidateSize({ pan: false });
        window.map.fitBounds(limiteBounds, {
          paddingTopLeft,
          paddingBottomRight,
          animate: false
        });
      };

      fetch("data/limite_alcaldia.geojson")
        .then(r => r.json())
        .then(gj => {
          limiteLayer = L.geoJSON(gj, { style: { color: "#000000", weight: 4, fill: false } }).addTo(map);
          try {
            limiteBounds = limiteLayer.getBounds();
            const expandedBounds = limiteBounds.pad(0.22);
            map.setMaxBounds(expandedBounds);
            window.adjustMapForSidebar();
          } catch(e) {}
        });

      const coloresTurno = { matutino: "#FFD700", tarde: "#FFD700", vespertino: "#3F51B5" };
      const rutasGeoJSON = { matutino: null, tarde: null, vespertino: null };
      const nodosGeoJSON = { matutino: null, tarde: null, vespertino: null };
      const capasRutasPorId = {};
      const nombresNodos = { matutino: "NODOS MATUTINO", tarde: "NODOS TARDE", vespertino: "NODOS VESPERTINO" };
      const turnos = ["matutino", "tarde", "vespertino"];
      const distanciaNodoMetros = 10;
      const routeIdKey = value => String(value || "").trim().toUpperCase().replace(/\s+/g, " ");

      function routeBaseId(value) {
        const match = routeIdKey(value).match(/^(\d+)/);
        return match ? match[1] : routeIdKey(value);
      }

      function routeExcludedInTurno(routeId, turno) {
        const id = routeIdKey(routeId);
        return id === "4 A IDA" || id === "4 A REGRESO" ||
          (turno === "matutino" && id === "12 REGRESO") ||
          (turno === "tarde" && id === "12 REGRESO") ||
          (turno === "vespertino" && id === "12 IDA");
      }

      function featureMatchesRoute(feature, routeId, turno) {
        if (!feature || routeExcludedInTurno(feature.properties?.IDENTIFICA, turno)) return false;
        return routeBaseId(feature.properties?.IDENTIFICA) === routeBaseId(routeId);
      }

      function selectRouteFeature(turno, routeId) {
        const features = (rutasGeoJSON[turno]?.features || []).filter(feature => featureMatchesRoute(feature, routeId, turno));
        if (!features.length) return null;
        const regreso = features.find(feature => /REGRESO/i.test(feature.properties?.IDENTIFICA || ""));
        const ida = features.find(feature => !/REGRESO/i.test(feature.properties?.IDENTIFICA || ""));
        return turno === "vespertino" ? (regreso || ida || features[0]) : (ida || features[0]);
      }

      function coordinatesFromGeometry(geometry) {
        if (!geometry?.coordinates) return [];
        const flatten = coordinates => coordinates.length && typeof coordinates[0] === "number"
          ? [coordinates]
          : coordinates.flatMap(flatten);
        return flatten(geometry.coordinates).map(coord => [Number(coord[1]), Number(coord[0])]);
      }

      function coordinatePartsFromGeometry(geometry) {
        if (!geometry?.coordinates) return [];
        const parts = geometry.type === "LineString" ? [geometry.coordinates] : geometry.coordinates;
        return parts.map(part => part.map(coord => [Number(coord[1]), Number(coord[0])])).filter(part => part.length > 1);
      }

      function offsetRouteSouth(feature, offsetMeters = 5) {
        if (!feature?.geometry?.coordinates) return feature;
        const geometry = feature.geometry;
        const rawParts = geometry.type === "LineString" ? [geometry.coordinates] : geometry.coordinates;
        const shiftedParts = rawParts.map(part => part.map((coordinate, index) => {
          const effectiveOffset = offsetMeters / 111320;
          return [
            Number(coordinate[0]),
            Number(coordinate[1]) - effectiveOffset,
            ...coordinate.slice(2)
          ];
        }));
        return { ...feature, geometry: { ...geometry, coordinates: geometry.type === "LineString" ? shiftedParts[0] : shiftedParts } };
      }

      function pointSegmentDistanceMeters(point, start, end) {
        const latScale = 111320;
        const lngScale = 111320 * Math.cos(point[0] * Math.PI / 180);
        const px = point[1] * lngScale, py = point[0] * latScale;
        const sx = start[1] * lngScale, sy = start[0] * latScale;
        const ex = end[1] * lngScale, ey = end[0] * latScale;
        const dx = ex - sx, dy = ey - sy;
        const t = dx || dy ? Math.max(0, Math.min(1, ((px - sx) * dx + (py - sy) * dy) / (dx * dx + dy * dy))) : 0;
        return Math.hypot(px - (sx + t * dx), py - (sy + t * dy));
      }

      function linesWithinMeters(first, second, meters) {
        const firstParts = coordinatePartsFromGeometry(first);
        const secondParts = coordinatePartsFromGeometry(second);
        const nearLine = (point, line) => line.slice(1).some((end, index) => pointSegmentDistanceMeters(point, line[index], end) <= meters);
        return firstParts.some(firstPart => firstPart.some(point => secondParts.some(secondPart => nearLine(point, secondPart)))) ||
          secondParts.some(secondPart => secondPart.some(point => firstParts.some(firstPart => nearLine(point, firstPart))));
      }

      function routeNodeFeatures(routeId) {
        const routeLines = turnos.map(turno => selectRouteFeature(turno, routeId)).filter(Boolean);
        const result = [];
        turnos.forEach(turno => {
          (nodosGeoJSON[turno]?.features || []).forEach(feature => {
            if (routeBaseId(feature.properties?.Ruta) !== routeBaseId(routeId)) return;
            if (routeLines.some(route => linesWithinMeters(feature.geometry, route.geometry, distanciaNodoMetros))) result.push({ feature, turno });
          });
        });
        return result;
      }

      function distanceMetersBetween(first, second) {
        const latScale = 111320;
        const lngScale = 111320 * Math.cos(first[0] * Math.PI / 180);
        return Math.hypot((second[1] - first[1]) * lngScale, (second[0] - first[0]) * latScale);
      }

      function pointDistanceToGeometryMeters(point, geometry) {
        const parts = coordinatePartsFromGeometry(geometry);
        if (!parts.length) return Infinity;
        return Math.min(...parts.flatMap(line => line.slice(1).map((end, index) => pointSegmentDistanceMeters(point, line[index], end))));
      }

      function routePositionForPoint(point, geometry) {
        let bestPosition = 0;
        let bestDistance = Infinity;
        let travelled = 0;
        coordinatePartsFromGeometry(geometry).forEach(line => {
          for (let index = 1; index < line.length; index += 1) {
            const start = line[index - 1];
            const end = line[index];
            const segmentLength = distanceMetersBetween(start, end);
            const distance = pointSegmentDistanceMeters(point, start, end);
            if (distance < bestDistance) {
              bestDistance = distance;
              bestPosition = travelled + segmentLength / 2;
            }
            travelled += segmentLength;
          }
        });
        return bestPosition;
      }

      function pointAtDistanceOnLine(points, distance) {
        let travelled = 0;
        for (let index = 1; index < points.length; index += 1) {
          const start = points[index - 1];
          const end = points[index];
          const segment = distanceMetersBetween(start, end);
          if (travelled + segment >= distance) {
            const fraction = (distance - travelled) / segment;
            return [start[0] + (end[0] - start[0]) * fraction, start[1] + (end[1] - start[1]) * fraction];
          }
          travelled += segment;
        }
        return points[points.length - 1];
      }

      function curvedArrowPoints(points, startDistance, endDistance) {
        const result = [pointAtDistanceOnLine(points, startDistance)];
        let travelled = 0;
        for (let index = 1; index < points.length; index += 1) {
          const segment = distanceMetersBetween(points[index - 1], points[index]);
          travelled += segment;
          if (travelled > startDistance && travelled < endDistance) result.push(points[index]);
        }
        result.push(pointAtDistanceOnLine(points, endDistance));
        return result;
      }

      const correctedArrowRoutes = new Set(["8", "10", "11", "12"]);

      function createDirectionArrows(feature, turno, conflictFeatures, referenceFeature = null, routeId = "") {
        const arrowLayer = L.layerGroup();
        if (typeof L.polylineDecorator !== "function") {
          console.error("PolylineDecorator no se cargó; no se pueden dibujar las flechas.");
          return arrowLayer;
        }
        const spacingMeters = 420;
        const arrowLengthMeters = 100;
        const conflictBufferMeters = 30;
        const arrowPixelSize = Math.max(3, Math.min(5, map.getZoom() - 9));
        coordinatePartsFromGeometry(feature?.geometry).forEach(sourcePoints => {
          let points = sourcePoints;
          if (turno === "vespertino") {
            const firstPosition = referenceFeature ? routePositionForPoint(sourcePoints[0], referenceFeature.geometry) : 0;
            const lastPosition = referenceFeature ? routePositionForPoint(sourcePoints[sourcePoints.length - 1], referenceFeature.geometry) : 0;
            points = referenceFeature
              ? (firstPosition < lastPosition ? [...sourcePoints].reverse() : sourcePoints)
              : [...sourcePoints].reverse();
          }
          if (correctedArrowRoutes.has(routeId)) points = [...points].reverse();
          const totalMeters = points.slice(1).reduce((sum, point, index) => sum + distanceMetersBetween(points[index], point), 0);
          for (let startDistance = 0; startDistance + arrowLengthMeters <= totalMeters; startDistance += spacingMeters) {
            const arrowPoints = curvedArrowPoints(points, startDistance, startDistance + arrowLengthMeters);
            const overlapsConflict = arrowPoints.some(point => conflictFeatures.some(conflict => pointDistanceToGeometryMeters(point, conflict.geometry) <= conflictBufferMeters));
            if (overlapsConflict || arrowPoints.length < 2) continue;

            const arrowLine = L.polyline(arrowPoints, {
              pane: "routeArrowsPane",
              color: "#111",
              weight: 1.5,
              opacity: .95,
              interactive: false
            }).addTo(arrowLayer);
            const decorator = L.polylineDecorator(arrowLine, {
              pane: "routeArrowsPane",
              patterns: [{
                offset: "100%",
                repeat: 0,
                symbol: L.Symbol.arrowHead({
                  pixelSize: arrowPixelSize,
                  polygon: false,
                  pathOptions: { color: "#111", weight: 1.5, opacity: .95, fill: false, interactive: false }
                })
              }]
            }).addTo(arrowLayer);
            arrowDecorators.push(decorator);
          }
        });
        return arrowLayer;
      }

      function routeExcludedInTurno(routeId, turno) {
        const normalizedRoute = String(routeId || '').trim().toUpperCase();
        const normalizedTurno = String(turno || '').trim().toLowerCase();

        if (normalizedTurno === 'matutino' || normalizedTurno === 'tarde') {
          return [
            '4 A IDA',
            '4 A REGRESO',
            '12 REGRESO'
          ].includes(normalizedRoute);
        }

        if (normalizedTurno === 'vespertino') {
          return [
            '4 A IDA',
            '4 A REGRESO',
            '12 IDA'
          ].includes(normalizedRoute);
        }

        return false;
      }

      function tiempoValido(record) {
        const tiempo = Number(record?.Tiempo);
        return Number.isFinite(tiempo) && tiempo > 0;
      }

      function buildRouteLayers() {
        const routeIds = [...new Set((rutasGeoJSON.matutino?.features || []).map(feature => routeBaseId(feature.properties?.IDENTIFICA)).filter(Boolean))].sort((a, b) => Number(a) - Number(b));
        routeIds.forEach(routeId => {
          const morningFeature = selectRouteFeature("matutino", routeId);
          const eveningFeature = selectRouteFeature("vespertino", routeId);
          const eveningRenderFeature = eveningFeature
            ? (routeId === "8" ? eveningFeature : offsetRouteSouth(eveningFeature, 5))
            : null;
          const morningName = morningFeature?.properties?.["O/D"] || `Ruta ${routeId}`;
          const eveningName = eveningFeature?.properties?.["O/D"] || morningName;
          const name = morningName !== eveningName ? `${morningName.split(" - ")[0]} ↔ ${eveningName.split(" - ")[0]}` : morningName;
          const layers = [];
          [["matutino", morningFeature], ["vespertino", eveningRenderFeature]].forEach(([turno, feature]) => {
            if (!feature) return;
            const line = L.geoJSON(feature, {
              style: routeStyle(turno),
              onEachFeature: (feat, layer) => layer.bindPopup(`<strong>Ruta:</strong> ${feat.properties?.["O/D"] || name}<br><em>Turno: ${turno}</em>`)
            });
            line.on("click", () => dibujarGraficaRuta(routeId, { matutino: morningName, tarde: morningName, vespertino: eveningName, comparison: name }));
            layers.push(line);
          });
          let matchingNodes = [];
          try {
            matchingNodes = routeNodeFeatures(routeId);
          } catch (error) {
            console.error(`No se pudieron filtrar los nodos de la ruta ${routeId}:`, error);
          }
          const nodeLayers = matchingNodes.map(({ feature }) => L.geoJSON(feature, {
            pane: "conflictNodesPane",
            style: { color: "#FF0000", weight: 6, opacity: 1 },
            onEachFeature: (feat, layer) => layer.bindPopup(`<strong>Conflicto vial</strong><br><strong>Motivo principal:</strong> ${feat.properties?.Motivo_Pri || feat.properties?.Motivo || "s/d"}<br><strong>Turno:</strong> ${feat.properties?.Turno || "s/d"}<br><strong>Amplitud:</strong> ${feat.properties?.Amplitud || "s/d"}`, { pane: "conflictPopupPane", className: "conflict-popup" })
          }));
          const conflictFeatures = matchingNodes.map(({ feature }) => feature);
          const arrows = [];
          if (morningFeature) arrows.push(createDirectionArrows(morningFeature, "matutino", conflictFeatures, null, routeId));
          if (eveningRenderFeature) arrows.push(createDirectionArrows(eveningRenderFeature, "vespertino", conflictFeatures, morningFeature, routeId));
          const nodes = L.layerGroup(nodeLayers);
          capasRutasPorId[routeId] = { layers, arrows, nodes };
          createRouteCheckbox(routeId, name);
          setRouteVisibility(routeId, true);
        });
        document.getElementById("chkRutas").addEventListener("change", event => {
          document.querySelectorAll(".route-checkbox").forEach(input => { input.checked = event.target.checked; setRouteVisibility(input.dataset.routeId, event.target.checked); });
          updateMasterRouteCheckbox();
        });
      }

      async function cargarTiempos() {
        try {
          const res = await fetch("data/tiempos.json");
          if (!res.ok) throw new Error(`Error HTTP ${res.status}`);
          const data = await res.json();
          console.log("Datos cargados (estructura):", Object.keys(data));
          
          // El JSON viene con estructura { Matutino: [...], Tarde: [...], Vespertino: [...] }
          // Combinar todos los arrays en uno solo
          let allData = [];
          for (const turnoKey in data) {
            if (Array.isArray(data[turnoKey])) {
              allData = allData.concat(data[turnoKey]);
            }
          }
          
          console.log("Total de registros combinados:", allData.length);
          console.log("Primeros 3 registros:", allData.slice(0, 3));
          
          return allData;
        } catch (error) {
          console.error("Error en cargarTiempos:", error);
          throw error;
        }
      }

      function obtenerDistancia(rutaId, turno) {
        const geoJson = rutasGeoJSON[turno];
        if (!geoJson) return 0;
        const feature = geoJson.features.find(f => 
          String(f.properties.IDENTIFICA).trim().toLowerCase() === String(rutaId).trim().toLowerCase()
        );
        return feature ? Number(feature.properties.Distancia) || 0 : 0;
      }

      async function dibujarGraficaRutaLegacy(rutaId, turno, titulo = "", subtitulo = "") {
        try {
          console.log("Iniciando dibujarGraficaRuta para ruta:", rutaId, "turno:", turno);
          const data = await cargarTiempos();
          console.log("Datos de tiempos cargados:", data.length, "registros");
          
          // Log de los primeros registros para ver la estructura
          console.log("Primeros 3 registros:", data.slice(0, 3));
          
          // Obtener todos los RUTAs_ID únicos
          const rutasUnicas = [...new Set(data.map(d => String(d.RUTAS_ID).trim().toLowerCase()))];
          const turnosUnicos = [...new Set(data.map(d => String(d.Turno).trim().toLowerCase()))];
          console.log("RUTAs_ID únicos en datos:", rutasUnicas.slice(0, 10));
          console.log("Turnos únicos en datos:", turnosUnicos);
          console.log("Buscando RUTAS_ID:", String(rutaId).trim().toLowerCase());
          console.log("Buscando Turno:", String(turno).trim().toLowerCase());

          if (routeExcludedInTurno(rutaId, turno)) {
            alert("No hay datos disponibles para esta ruta y turno.");
            return;
          }

          const filtrado = data.filter(d =>
            String(d["RUTAS ID"]).trim().toLowerCase() === String(rutaId).trim().toLowerCase() &&
            String(d.Turno).trim().toLowerCase() === String(turno).trim().toLowerCase() &&
            tiempoValido(d)
          );
          console.log("Registros filtrados:", filtrado.length);
            
          if (filtrado.length === 0) {
            alert("No hay datos disponibles para esta ruta y turno.");
            return;
          }
     
        const origenDestino = filtrado[0]["Origen / Destino"] || "";

        const tiemposPorTransporte = {};
        filtrado.forEach(d => {
          const fecha = d.Fecha;
          const tipo = d["TIPO TRANSPORTE"];
          const tiempo = Number(d.Tiempo);
          if (!tiempoValido(d)) return;
          if (!tiemposPorTransporte[tipo]) tiemposPorTransporte[tipo] = {};
          tiemposPorTransporte[tipo][fecha] = tiempo;
        });

        // Calcular promedios
        const promedios = {};
        for (const tipo in tiemposPorTransporte) {
          const tiempos = Object.values(tiemposPorTransporte[tipo]);
          const suma = tiempos.reduce((acc, val) => acc + val, 0);
          const promedio = suma / tiempos.length;
          promedios[tipo] = promedio.toFixed(2);
        }
        
        // Obtener distancia del GeoJSON
        const distanciaKm = obtenerDistancia(rutaId, turno);
        
        // Calcular velocidades en km/h basadas en los tiempos promedios
        // Velocidad = Distancia / Tiempo (en horas)
        const velocidades = {};
        for (const tipo in promedios) {
          const tiempoMinutos = Number(promedios[tipo]);
          const tiempoHoras = tiempoMinutos / 60;
          velocidades[tipo] = tiempoHoras > 0 ? (distanciaKm / tiempoHoras).toFixed(1) : 0;
        }


        const fechasSet = new Set();
        Object.values(tiemposPorTransporte).forEach(obj => {
          Object.keys(obj).forEach(f => fechasSet.add(f));
        });
        const fechas = Array.from(fechasSet).sort();
        const coloresPorTransporte = {
          "Ruta Transporte": "#4CAF50",  // Azul
          "Ruta Vehiculo ": "#616161"     // Naranja
        };
        const datasets = Object.keys(tiemposPorTransporte).map(tipo => {
          return {
            label: tipo,
            data: fechas.map(f => tiemposPorTransporte[tipo][f] ?? null),
            borderColor: coloresPorTransporte[tipo] || "#000",
            backgroundColor: coloresPorTransporte[tipo] || "#000",
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 0,
            tension: 0.25
          };
        });

        // Calcular promedios mensuales
        const tiemposPorMes = {};
        const mesesMap = new Map(); // Guardar fecha para ordenar cronológicamente
        filtrado.forEach(d => {
          const fecha = new Date(d.Fecha);
          const mesNum = fecha.getMonth();
          const año = fecha.getFullYear();
          const mesLabel = fecha.toLocaleString('es-ES', { year: 'numeric', month: 'short' });
          const mesKey = `${año}-${String(mesNum).padStart(2, '0')}`;
          
          const tipo = d["TIPO TRANSPORTE"];
          const tiempo = Number(d.Tiempo);
          if (!tiemposPorMes[tipo]) tiemposPorMes[tipo] = {};
          if (!tiemposPorMes[tipo][mesKey]) tiemposPorMes[tipo][mesKey] = [];
          tiemposPorMes[tipo][mesKey].push(tiempo);
          
          mesesMap.set(mesKey, mesLabel);
        });

        // Calcular promedios de cada mes y ordenar cronológicamente
        const mesesSet = new Set();
        Object.values(tiemposPorMes).forEach(obj => {
          Object.keys(obj).forEach(m => mesesSet.add(m));
        });
        const mesesKeys = Array.from(mesesSet).sort();
        const meses = mesesKeys.map(mesKey => mesesMap.get(mesKey));
        
        const datasetsMensual = Object.keys(tiemposPorMes).map(tipo => {
          return {
            label: tipo,
            data: mesesKeys.map(mesKey => {
              const tiempos = tiemposPorMes[tipo][mesKey] || [];
              return tiempos.length > 0 ? (tiempos.reduce((a, b) => a + b, 0) / tiempos.length).toFixed(2) : null;
            }),
            borderColor: coloresPorTransporte[tipo] || "#000",
            backgroundColor: coloresPorTransporte[tipo] || "#000",
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 0,
            tension: 0.25
          };
        });

        const info = document.getElementById("estadisticasInfo");
        const legacyOdometer = (label, rawValue, color) => {
          const value = Number(rawValue) || 0;
          const maxSpeed = 80;
          const boundedValue = Math.min(Math.max(value, 0), maxSpeed);
          const needleAngle = Math.PI + (boundedValue / maxSpeed) * Math.PI;
          const needleX = 90 + Math.cos(needleAngle) * 76;
          const needleY = 90 + Math.sin(needleAngle) * 76;
          const progress = (boundedValue / maxSpeed) * 251.3;
          const gauge = `<svg viewBox="0 0 180 100" width="180" height="100" role="img" aria-label="Indicador de velocidad"><path d="M 10 90 A 80 80 0 0 1 170 90" fill="none" stroke="#dedede" stroke-width="16"/><path d="M 10 90 A 80 80 0 0 1 170 90" fill="none" stroke="${color}" stroke-width="16" stroke-dasharray="${progress} 251.3" stroke-linecap="butt"/><line x1="90" y1="90" x2="${needleX}" y2="${needleY}" stroke="#333" stroke-width="3"/><circle cx="90" cy="90" r="10" fill="#333"/></svg>`;
          return `<div class="speed-odometer" style="display:inline-block;width:210px;text-align:center;vertical-align:top" aria-label="${label}: ${value.toFixed(1)} km/h"><div class="odometer-title">${value.toFixed(1)} km/h</div>${gauge}<div class="odometer-label">${label}</div></div>`;
        };
        info.innerHTML = `
          <div><strong>Ruta:</strong> ${origenDestino ? `<span class="ruta-pill">${origenDestino}</span>` : ""}</div>
          <div><strong>Turno:</strong> ${turno}</div>
          <div><strong>Promedios:</strong></div>
          <ul>
            ${Object.entries(promedios).map(([tipo, valor]) => `<li>${tipo}: ${valor} min</li>`).join("")}
          </ul>
          <section class="speed-odometers" style="display:block;text-align:center;width:100%;margin-top:20px" aria-label="Velocidad promedio"><h6>Velocidad promedio</h6><div style="display:flex;justify-content:center;align-items:flex-start;gap:20px;flex-wrap:wrap">${legacyOdometer("Ruta Transporte", velocidades["Ruta Transporte"], "#4CAF50")}${legacyOdometer("Ruta Vehículo", velocidades["Ruta Vehiculo"] ?? velocidades["Ruta Vehiculo "], "#616161")}</div></section>
        `;
        document.getElementById("estadisticasDistancia").textContent = `Distancia: ${distanciaKm.toFixed(2)} km`;

        // Construir tabla mensual SOLO para el turno seleccionado
        (function renderTablaMensual(){
          const turnoSeleccionado = String(turno).trim().toLowerCase();
          const filtradoTurno = data.filter(d =>
            String(d["RUTAS ID"]).trim().toLowerCase() === String(rutaId).trim().toLowerCase() &&

            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: true }, tooltip: { mode: "index", intersect: false } },
            scales: { x: { title: { display: true, text: "Días" } }, y: { title: { display: true, text: "Tiempo (min)" }, beginAtZero: true } }
          }
        });

        window.chartRefMensual = new Chart(ctxMensual, {
          type: "line",
          data: { labels: meses, datasets: datasetsMensual },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: true }, tooltip: { mode: "index", intersect: false } },
            scales: { x: { title: { display: true, text: "Meses" } }, y: { title: { display: true, text: "Tiempo (min)" }, beginAtZero: true } }
          }
        });

        // Resetear vistas y agregar listeners solo una vez
        if (!window.togglesConfigured) {
          const btnDiaria = document.getElementById('btnVistasDiaria');
          const btnMensual = document.getElementById('btnVistaMensual');
          
          btnDiaria.addEventListener('click', function() {
            const ctxDia = document.getElementById("estadisticasChart");
            const ctxMes = document.getElementById("estadisticasChartMensual");
            
            if (!this.classList.contains('active')) {
              this.classList.add('active');
              this.classList.remove('btn-vista-outline');
              this.classList.add('btn-vista');
              btnMensual.classList.remove('active');
              btnMensual.classList.add('btn-vista-outline');
              btnMensual.classList.remove('btn-vista');
              ctxDia.style.display = 'block';
              ctxMes.style.display = 'none';
              if (chartRef) chartRef.resize();
            }
          });

          btnMensual.addEventListener('click', function() {
            const ctxDia = document.getElementById("estadisticasChart");
            const ctxMes = document.getElementById("estadisticasChartMensual");
            
            if (!this.classList.contains('active')) {
              this.classList.add('active');
              this.classList.remove('btn-vista-outline');
              this.classList.add('btn-vista');
              btnDiaria.classList.remove('active');
              btnDiaria.classList.add('btn-vista-outline');
              btnDiaria.classList.remove('btn-vista');
              ctxDia.style.display = 'none';
              ctxMes.style.display = 'block';
              if (window.chartRefMensual) window.chartRefMensual.resize();
            }
          });
          
          window.togglesConfigured = true;
        }

        // Resetear botones a vista diaria
        const btnDiaria2 = document.getElementById('btnVistasDiaria');
        const btnMensual2 = document.getElementById('btnVistaMensual');
        const ctx2 = document.getElementById("estadisticasChart");
        const ctxMensual2 = document.getElementById("estadisticasChartMensual");
        
        btnDiaria2.classList.add('active');
        btnDiaria2.classList.remove('btn-vista-outline');
        btnDiaria2.classList.add('btn-vista');
        btnMensual2.classList.remove('active');
        btnMensual2.classList.add('btn-vista-outline');
        btnMensual2.classList.remove('btn-vista');
        ctx2.style.display = 'block';
        ctxMensual2.style.display = 'none';

        const gaugeOptions = (value, color, maxValue = 80) => {
          return {
            type: 'doughnut',
            data: {
              datasets: [{
                data: [Math.min(value, maxValue), Math.max(0, maxValue - value)],
                backgroundColor: [color, '#e0e0e0'],
                borderWidth: 0,
                cutout: '80%'
              }]
            },
            options: {
              rotation: -90,
              circumference: 180,
              plugins: {
                legend: { display: false },
                tooltip: { enabled: false },
                title: {
                  display: true,
                  text: `${value} km/h`,
                  font: { size: 16 }
                },
                datalabels: { display: false }
              }
            },
            plugins: [{
              id: 'needle',
              afterDraw(chart) {
                const { ctx } = chart;
                try {
                  const meta = chart.getDatasetMeta(0);
                  if (!meta || !meta.data || !meta.data.length) return;
                  const arc = meta.data[0];
                  const cx = arc.x;
                  const cy = arc.y;
                  const outer = arc.outerRadius || (arc._model && arc._model.outerRadius) || Math.min(chart.width, chart.height) / 2;
                  const endAngle = arc.endAngle ?? (arc._model && arc._model.endAngle);
                  if (endAngle == null) return;

                  const length = outer * 0.95;
                  const tipX = cx + Math.cos(endAngle) * length;
                  const tipY = cy + Math.sin(endAngle) * length;

                  ctx.save();
                  ctx.strokeStyle = '#333';
                  ctx.lineWidth = 3;
                  ctx.beginPath();
                  ctx.moveTo(cx, cy);
                  ctx.lineTo(tipX, tipY);
                  ctx.stroke();

                  ctx.fillStyle = '#333';
                  ctx.beginPath();
                  ctx.arc(cx, cy, 8, 0, 2 * Math.PI);
                  ctx.fill();
                  ctx.restore();
                } catch (e) { /* silent */ }
              }
            }]
          };
        };

        // Destruir gráficas anteriores si existen
        if (window.chartTransporte) { window.chartTransporte.destroy(); }
        if (window.chartVehiculo) { window.chartVehiculo.destroy(); }

        // Crear velocímetros con los valores calculados
        window.chartTransporte = new Chart(document.getElementById("velTransporte"), gaugeOptions(velocidades["Ruta Transporte"], '#4CAF50', 80));
        window.chartVehiculo = new Chart(document.getElementById("velVehiculo"), gaugeOptions(velocidades["Ruta Vehiculo"], '#616161', 80));



        const modal = new bootstrap.Modal(document.getElementById("estadisticasModal"));
        modal.show();
        console.log("Modal mostrado correctamente");
        } catch (error) {
          console.error("Error en dibujarGraficaRuta:", error);
          alert("Error al cargar la gráfica: " + error.message);
        }
      }
      function statsRouteMatches(record, routeId) {
        const recordId = String(record["RUTAS ID"] || "").trim().toLowerCase();
        const selectedId = String(routeId || "").trim().toLowerCase();
        if (recordId === selectedId) return true;
        if (!/^12(?:\s|$)/.test(selectedId)) return false;
        return new Set(["12 ida", "12 regreso", "12 a ida", "12 a regreso"]).has(recordId);
      }

      function statsLabel(type) {
        if (type === "Ruta Transporte") return "Ruta Transporte";
        if (type === "Odometro") return "Odómetro";
        return "Ruta Vehículo";
      }

      function statsType(record) {
        const type = String(record["TIPO TRANSPORTE"] || "").trim().toLowerCase();
        if (type.includes("odometro") || type.includes("odómetro")) return "Odometro";
        if (type === "ruta transporte") return "Ruta Transporte";
        if (type === "ruta vehiculo" || type === "ruta vehículo") return "Ruta Vehiculo";
        return null;
      }

      function average(values) {
        const validValues = values.filter(value => Number.isFinite(value) && value > 0);
        return validValues.length ? validValues.reduce((sum, value) => sum + value, 0) / validValues.length : null;
      }

      function routeDistance(routeId, turno) {
        const feature = selectRouteFeature(turno, routeId);
        return Number(feature?.properties?.Distancia || 0);
      }

      function calculateTurnStats(routeId, turno, records) {
        const filtered = records.filter(record => statsRouteMatches(record, routeId) && String(record.Turno || "").trim().toLowerCase() === turno && tiempoValido(record));
        const byType = { "Ruta Transporte": [], "Ruta Vehiculo": [], Odometro: [] };
        filtered.forEach(record => {
          const type = statsType(record);
          if (byType[type] && tiempoValido(record)) byType[type].push({ date: record.Fecha, value: Number(record.Tiempo) });
        });
        const values = type => byType[type].map(item => item.value).filter(Number.isFinite);
        const transport = average(values("Ruta Transporte"));
        const vehicle = average(values("Ruta Vehiculo"));
        const odometer = average(values("Odometro"));
        const distance = routeDistance(routeId, turno);
        return {
          filtered, byType, distance,
          transport, vehicle,
          odometer,
          transportSpeed: transport ? distance / (transport / 60) : null,
          vehicleSpeed: vehicle ? distance / (vehicle / 60) : null,
          odometerSpeed: odometer ? distance / (odometer / 60) : null,
          delta: transport !== null && vehicle !== null ? transport - vehicle : null,
          deltaPercent: transport !== null && vehicle ? ((transport - vehicle) / vehicle) * 100 : null
        };
      }

      function renderTurnStats(routeId, routeName, turno, stats) {
        const container = document.getElementById(`tab${turno.charAt(0).toUpperCase()}${turno.slice(1)}`);
        if (!container) return;
        const types = ["Ruta Transporte", "Ruta Vehiculo", ...(stats.odometer !== null ? ["Odometro"] : [])];
        const dates = [...new Set(stats.filtered.map(record => record.Fecha))].sort();
        const monthly = {};
        stats.filtered.forEach(record => {
          const date = new Date(record.Fecha);
          const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
          const type = String(record["TIPO TRANSPORTE"] || "").trim();
          if (!monthly[key]) monthly[key] = { label: date.toLocaleString("es-ES", { month: "short", year: "numeric" }) };
          if (!monthly[key][type]) monthly[key][type] = [];
          monthly[key][type].push(Number(record.Tiempo));
        });
        const monthKeys = Object.keys(monthly).sort();
        const monthlyRows = types.map(type => `<tr><td class="tabla-row-label"><strong>${statsLabel(type)}</strong></td>${monthKeys.map(key => `<td class="tabla-data">${average(monthly[key][type] || [])?.toFixed(2) || "-"}</td>`).join("")}</tr>`).join("");
        const monthlyTable = monthKeys.length ? `<div class="table-responsive"><table class="table table-sm table-striped"><thead><tr><th class="tabla-row-label">Tipo / Mes</th>${monthKeys.map(key => `<th class="tabla-mes-header">${monthly[key].label}</th>`).join("")}</tr></thead><tbody>${monthlyRows}</tbody></table></div>` : '<div class="text-muted">No hay datos mensuales para este turno en esta ruta.</div>';
        const speed = value => value === null ? "Sin datos" : `${value.toFixed(1)} km/h`;
        const odometer = (label, value, color) => {
          const maxSpeed = 80;
          const numericValue = value === null ? 0 : Math.min(Math.max(value, 0), maxSpeed);
          const needleAngle = Math.PI + (numericValue / maxSpeed) * Math.PI;
          const needleX = 90 + Math.cos(needleAngle) * 76;
          const needleY = 90 + Math.sin(needleAngle) * 76;
          const progress = (numericValue / maxSpeed) * 251.3;
          const gauge = `<svg viewBox="0 0 180 100" width="180" height="100" role="img" aria-label="Indicador de velocidad"><path d="M 10 90 A 80 80 0 0 1 170 90" fill="none" stroke="#dedede" stroke-width="16"/><path d="M 10 90 A 80 80 0 0 1 170 90" fill="none" stroke="${color}" stroke-width="16" stroke-dasharray="${progress} 251.3" stroke-linecap="butt"/><line x1="90" y1="90" x2="${needleX}" y2="${needleY}" stroke="#333" stroke-width="3"/><circle cx="90" cy="90" r="10" fill="#333"/></svg>`;
          return `<div class="speed-odometer" style="display:inline-block;width:210px;text-align:center;vertical-align:top" aria-label="${label}: ${speed(value)}"><div class="odometer-title">${speed(value)}</div>${gauge}<div class="odometer-label">${label}</div></div>`;
        };
        const directionNotes = { matutino: "los datos en este turno se monitorean en sentido Oeste a Este (Bajada)", tarde: "los datos en este turno se monitorean en sentido Oeste a Este (Bajada)", vespertino: "los datos en este turno se monitorean en sentido Este a Oeste (Subida)" };
        container.innerHTML = `<div class="mb-2"><strong>Ruta:</strong> <span class="ruta-pill">${routeName}</span><br><strong>Turno:</strong> ${turno.charAt(0).toUpperCase() + turno.slice(1)}<span class="turn-direction-note">${directionNotes[turno]}</span><br><strong>Promedios:</strong><ul><li>Ruta Transporte: ${stats.transport?.toFixed(2) || "Sin datos"} min</li><li>Ruta Vehículo: ${stats.vehicle?.toFixed(2) || "Sin datos"} min</li>${stats.odometer !== null ? `<li>Odómetro: ${stats.odometer.toFixed(2)} min</li>` : ""}</ul></div><div class="mb-3">${monthlyTable}</div><div class="mb-2 text-center"><button class="btn btn-sm btn-vista active stats-view-button" data-chart="daily-${turno}">Vista Diaria</button> <button class="btn btn-sm btn-vista-outline stats-view-button" data-chart="monthly-${turno}">Vista Mensual</button></div><canvas id="daily-${turno}" class="turn-chart"></canvas><canvas id="monthly-${turno}" class="turn-chart" style="display:none"></canvas><section class="speed-odometers" style="display:block;text-align:center;width:100%;margin-top:20px" aria-label="Velocidad promedio"><h6>Velocidad promedio</h6><div style="display:flex;justify-content:center;align-items:flex-start;gap:20px;flex-wrap:wrap">${odometer("Ruta Transporte", stats.transportSpeed, "#4CAF50")}${odometer("Ruta Vehículo", stats.vehicleSpeed, "#616161")}</div></section>`;
        const datasets = types.map(type => ({ label: statsLabel(type), data: dates.map(date => { const item = stats.byType[type].find(value => value.date === date); return item?.value ?? null; }), borderColor: type === "Ruta Transporte" ? "#4CAF50" : "#616161", backgroundColor: type === "Ruta Transporte" ? "#4CAF50" : "#616161", tension: .25, pointRadius: 0 }));
        const monthDatasets = types.map(type => ({ label: statsLabel(type), data: monthKeys.map(key => average(monthly[key][type] || [])), borderColor: type === "Ruta Transporte" ? "#4CAF50" : "#616161", backgroundColor: type === "Ruta Transporte" ? "#4CAF50" : "#616161", tension: .25, pointRadius: 0 }));
        window.routeCharts = window.routeCharts || {};
        [window.routeCharts[`daily-${turno}`], window.routeCharts[`monthly-${turno}`]].forEach(chart => chart?.destroy());
        window.routeCharts[`daily-${turno}`] = new Chart(document.getElementById(`daily-${turno}`), { type: "line", data: { labels: dates, datasets }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, title: { display: true, text: "Tiempo (min)" } } } } });
        window.routeCharts[`monthly-${turno}`] = new Chart(document.getElementById(`monthly-${turno}`), { type: "line", data: { labels: monthKeys.map(key => monthly[key].label), datasets: monthDatasets }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, title: { display: true, text: "Tiempo (min)" } } } } });
        container.querySelectorAll(".stats-view-button").forEach(button => button.addEventListener("click", () => { const daily = button.dataset.chart.startsWith("daily"); container.querySelector(`#daily-${turno}`).style.display = daily ? "block" : "none"; container.querySelector(`#monthly-${turno}`).style.display = daily ? "none" : "block"; container.querySelectorAll(".stats-view-button").forEach(item => item.classList.toggle("active", item === button)); window.routeCharts[button.dataset.chart]?.resize(); }));
      }

      function renderComparison(routeId, routeName, allStats) {
        const turnLabels = ["Matutino", "Tarde", "Vespertino"];
        const slowest = turnLabels.reduce((current, label) => !allStats[label.toLowerCase()].transport ? current : (!current || allStats[label.toLowerCase()].transport > current.value ? { label, value: allStats[label.toLowerCase()].transport } : current), null);
        const fastest = turnLabels.reduce((current, label) => !allStats[label.toLowerCase()].transport ? current : (!current || allStats[label.toLowerCase()].transport < current.value ? { label, value: allStats[label.toLowerCase()].transport } : current), null);
        const slowPercent = slowest && fastest ? ((slowest.value - fastest.value) / fastest.value * 100).toFixed(1) : "0.0";
        const widest = turnLabels.reduce((current, label) => { const value = Math.abs(allStats[label.toLowerCase()].delta || 0); return !current || value > current.value ? { label, value } : current; }, null);
        const valueText = value => value === null ? "Sin datos" : value.toFixed(2);
        const rows = [["Tiempo transporte", stats => stats.transport], ["Tiempo vehículo", stats => stats.vehicle], ["Velocidad transporte", stats => stats.transportSpeed], ["Velocidad vehículo", stats => stats.vehicleSpeed], ["Delta transporte - vehículo", stats => stats.delta], ["Delta porcentual", stats => stats.deltaPercent]].map(([label, getter]) => `<tr><th>${label}</th>${turnLabels.map(labelTurno => `<td>${valueText(getter(allStats[labelTurno.toLowerCase()]))}${label.includes("Velocidad") ? " km/h" : label.includes("porcentual") ? " %" : " min"}</td>`).join("")}</tr>`).join("");
        document.getElementById("comparativoContenido").innerHTML = `<h6>${routeName}</h6><p>${slowest && fastest ? `El turno más lento es ${slowest.label}, con ${slowPercent}% más tiempo que ${fastest.label}, el turno más rápido.` : "No hay suficientes datos para comparar los turnos."} ${widest ? `La brecha más amplia entre transporte público y vehículo particular aparece en ${widest.label}.` : ""}</p><div class="table-responsive"><table class="table table-sm table-bordered comparison-table"><thead><tr><th>Indicador</th>${turnLabels.map(label => `<th>${label}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
        window.comparisonChart?.destroy();
        window.comparisonChart = new Chart(document.getElementById("comparativoChart"), { type: "bar", data: { labels: turnLabels, datasets: [{ label: "Ruta Transporte", data: turnLabels.map(label => allStats[label.toLowerCase()].transport), backgroundColor: "#4CAF50" }, { label: "Ruta Vehículo", data: turnLabels.map(label => allStats[label.toLowerCase()].vehicle), backgroundColor: "#616161" }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, title: { display: true, text: "Tiempo (min)" } } } } });
      }

      async function dibujarGraficaRuta(routeId, routeNames) {
        try {
          const response = await fetch("data/tiempos.json");
          const source = await response.json();
          const records = Object.values(source).flat();
          const allStats = Object.fromEntries(turnos.map(turno => [turno, calculateTurnStats(routeId, turno, records)]));
          document.querySelector("#estadisticasModal .modal-title").textContent = routeNames.comparison;
          turnos.forEach(turno => renderTurnStats(routeId, routeNames[turno], turno, allStats[turno]));
          renderComparison(routeId, routeNames.comparison, allStats);
          const distance = allStats.matutino.distance || allStats.tarde.distance || allStats.vespertino.distance;
          document.getElementById("estadisticasDistancia").textContent = `Distancia: ${distance.toFixed(2)} km`;
          new bootstrap.Modal(document.getElementById("estadisticasModal")).show();
        } catch (error) { console.error("Error al cargar estadísticas de la ruta:", error); alert("No se pudieron cargar las estadísticas de esta ruta."); }
      }

      } catch(error) {
        console.error("Error en el script principal:", error);
        alert("Error en la aplicación: " + error.message);
      }
    </script>
